# Spring Boot Configuration
server.port=8080

# File Upload Limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Google Gemini API Key configuration
# Can be overridden via system environment variable GEMINI_API_KEY or via header/payload
langchain4j.googleai.api-key=${GEMINI_API_KEY:demo-key}
langchain4j.googleai.model-name=gemini-1.5-flash

# Logging configuration
logging.level.com.aipdf.chat=INFO
logging.level.dev.langchain4j=INFO
